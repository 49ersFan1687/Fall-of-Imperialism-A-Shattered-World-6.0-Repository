### Starting Ideas ###
CAL_idea_last_bastion_of_liberty: "The Last Bastion of Liberty"
CAL_idea_last_bastion_of_liberty_desc: "We are what one could say as the Last Bastion of Liberty. Thousands evac'd here after the US collapsed, and many in the Little Free World consider California as the sole recognized successor of the old United States of America. We have stood guard over the remnants of the US, ready and waiting to unite and strike the Axis. That time is soon to come."

